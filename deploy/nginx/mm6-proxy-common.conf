# Shared by every mm6 location that proxies to the app (/, /mcp, uploads,
# template writes): the maintenance gate plus the proxy headers, so the
# locations cannot drift apart. Needs `set $mm6_tenant <key>;` in the server.
# proxy_pass and the per-location limits and timeouts stay in the vhost.
include snippets/mm6-maintenance-gate.conf;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
