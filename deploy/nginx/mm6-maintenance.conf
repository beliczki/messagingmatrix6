# mm6 maintenance page — included INSIDE each mm6 `server` block,
# AFTER `set $mm6_tenant <key>;` (e.g. erste, telekom).
#
# Source of truth for "a deploy is running":
#   /var/www/mm6-maintenance/<tenant>.deploying
#     present -> the gate in each proxying location returns 503
#     absent  -> normal proxying
#
# The same page also covers an unplanned 502/504, so a crash never shows a raw
# nginx error page again. The file's content is the status JSON the page reads.
#
# Deliberately NOT a server-level gate: /__deploy-status.json and the logo must
# stay reachable exactly while everything else is gated, and a server-level
# `if` would swallow them too.

error_page 502 503 504 =503 @mm6_maintenance;

# Never gated: the page reads its start time from here. 404 = no deploy running.
location = /__deploy-status.json {
    root /var/www/mm6-maintenance;
    try_files /$mm6_tenant.deploying =404;
    default_type application/json;
    add_header Cache-Control "no-store" always;
}

# Never gated: the maintenance page's own assets.
location /__maintenance/ {
    alias /var/www/mm6-maintenance/;
    add_header Cache-Control "no-store" always;
}

location @mm6_maintenance {
    root /var/www/mm6-maintenance;
    add_header Cache-Control "no-store" always;
    add_header Retry-After 60 always;
    try_files /index.html =503;
}

# MCP clients parse the body; they get JSON, not the HTML page.
location @mm6_maintenance_json {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Retry-After 60 always;
    return 503 '{"error":"maintenance","message":"Messaging Matrix is being redeployed. Try again shortly."}';
}
